services:
  db:
    image: postgres:16
    container_name: cal-ai-db
    environment:
      POSTGRES_USER: cal_ai
      POSTGRES_PASSWORD: cal_ai_local
      POSTGRES_DB: cal_ai
    ports:
      - "5432:5432"
    volumes:
      - cal_ai_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cal_ai -d cal_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  cal_ai_pg_data:
